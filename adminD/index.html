<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0b132b">
<title>بوابة الإدارة المستقلة | مدرسة عمر بن الخطاب ث بنين</title>
<style>
:root{color-scheme:light;--navy:#0b132b;--teal:#0b4650;--gold:#d6a83e;--ink:#172033;--muted:#64748b;--line:#dbe3ef}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 15% 10%,#1c6670 0%,transparent 38%),linear-gradient(140deg,#071a2c 0%,#0b4650 48%,#0b132b 100%);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}
main{width:min(100%,440px);background:#fff;border:1px solid #ffffff80;border-radius:24px;padding:30px;box-shadow:0 24px 70px #02061755}
.mark{width:82px;height:82px;margin:0 auto 16px;border-radius:22px;background:#fff;border:1px solid #dbe3ef;box-shadow:0 8px 24px #0b132b18;display:grid;place-items:center;overflow:hidden}.mark img{width:100%;height:100%;object-fit:cover}
h1{text-align:center;font-size:22px;line-height:1.6;color:var(--navy);margin:0}.sub{text-align:center;color:var(--muted);font-size:13px;line-height:1.8;margin:8px 0 24px}
label{display:block;font-size:13px;font-weight:bold;margin:0 0 8px}input{width:100%;height:50px;border:1px solid #cbd5e1;border-radius:12px;padding:0 14px;font:inherit;font-size:16px;outline:none}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #d6a83e30}button{width:100%;height:48px;margin-top:14px;border:0;border-radius:12px;background:var(--navy);color:#f8d77b;font:inherit;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}.message{display:none;margin-top:16px;padding:12px;border-radius:10px;font-size:13px;line-height:1.8;text-align:center}
.error{display:block;background:#fff1f2;color:#be123c}.success{display:block;background:#ecfdf5;color:#047857}
.session{display:none;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}.session p{text-align:center;color:#047857;font-weight:bold;font-size:14px;line-height:1.9}
.logout{background:#475569;color:white}.foot{text-align:center;color:#94a3b8;font-size:11px;margin-top:22px}
</style></head>
<body><main>
<div class="mark"><img src="../assets/school-entrance-favicon.svg" alt="رمز مدرسة عمر بن الخطاب ث بنين"></div><h1>بوابة إدارة الموقع</h1>
<p class="sub">مدرسة عمر بن الخطاب ث بنين<br>دخول المسؤول لإدارة الموقع وخدمات المعاينة</p>
<form id="loginForm"><label for="password">كلمة مرور المسؤول</label>
<input id="password" type="password" autocomplete="current-password" required placeholder="أدخل كلمة المرور">
<button id="loginButton" type="submit">تسجيل الدخول</button></form>
<div id="message" class="message" role="status" aria-live="polite"></div>
<section id="sessionPanel" class="session" aria-live="polite"><p>تم التحقق من كلمة المرور وإنشاء جلسة مسؤول على خدمة المعاينة المعزولة.</p>
<button id="logoutButton" class="logout" type="button">تسجيل الخروج</button></section>
<div class="foot">بوابة إدارية خاصة — غير مفهرسة لمحركات البحث</div></main>
<iframe id="appsScriptFrame" name="appsScriptFrame" title="اتصال بخدمة المعاينة" hidden></iframe>
<script>
(() => {
const WEB_APP_URL="https://script.google.com/macros/s/AKfycbwE-mDS3J7B5Tt3S4CBo8i4o65q19VtzAALjNCFSDJnskIIQHuCPbco5Kk0nea537Bt/exec";
const form=document.getElementById("loginForm"),password=document.getElementById("password"),loginButton=document.getElementById("loginButton"),logoutButton=document.getElementById("logoutButton"),message=document.getElementById("message"),sessionPanel=document.getElementById("sessionPanel"),frame=document.getElementById("appsScriptFrame");
let sessionToken="",busy=false;
function showMessage(t,k){message.textContent=t;message.className="message "+k}
function isFrameOrDescendant(source,expected){const pending=[expected],visited=new Set();while(pending.length&&visited.size<64){const current=pending.pop();if(!current||visited.has(current))continue;visited.add(current);if(source===current)return true;let count=0;try{count=current.length}catch(_){continue}for(let i=0;i<count;i++){try{if(current.frames[i])pending.push(current.frames[i])}catch(_){}}}return false}
function trustedMessage(event,expected){if(!event||!event.source||event.source===window||!isFrameOrDescendant(event.source,expected))return false;let url;try{url=new URL(event.origin)}catch(_){return false}if(url.protocol!=="https:"||url.username||url.password||url.port)return false;const host=url.hostname.toLowerCase(),suffix="-script.googleusercontent.com",prefix=host.endsWith(suffix)?host.slice(0,-suffix.length):"";return host==="script.google.com"||host==="script.googleusercontent.com"||(prefix.length>0&&/^[a-z0-9-]+$/.test(prefix))}
function postAction(fields,expectedType,callback){if(busy)return;busy=true;const nonce=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2),expectedFrame=frame.contentWindow;let finished=false;
const finish=result=>{if(finished)return;finished=true;window.removeEventListener("message",onMessage);clearTimeout(timeout);busy=false;callback(result)};
const onMessage=event=>{if(!trustedMessage(event,expectedFrame))return;const data=event.data;if(!data||data.type!==expectedType||data.nonce!==nonce)return;finish(data.result||{success:false,message:"استجابة غير مكتملة من الخدمة."})};
window.addEventListener("message",onMessage);const timeout=setTimeout(()=>finish({success:false,message:"لم يصل رد من خدمة المعاينة. راجع عنوان الموقع المسموح في Apps Script."}),20000);
try{const request=document.createElement("form");request.method="POST";request.action=WEB_APP_URL;request.target="appsScriptFrame";request.hidden=true;Object.entries(Object.assign({},fields,{nonce,origin:window.location.origin})).forEach(([name,value])=>{const input=document.createElement("input");input.type="hidden";input.name=name;input.value=String(value);request.appendChild(input)});document.body.appendChild(request);request.submit();request.remove()}catch(_){finish({success:false,message:"تعذر إرسال الطلب إلى خدمة المعاينة."})}}
form.addEventListener("submit",event=>{event.preventDefault();if(!password.value.trim()){showMessage("أدخل كلمة مرور المسؤول أولاً.","error");return}loginButton.disabled=true;showMessage("جارٍ التحقق من بيانات الدخول...","success");
postAction({action:"adminLogin",password:password.value},"adminLoginResult",result=>{loginButton.disabled=false;password.value="";if(result&&result.success&&result.token){sessionToken=result.token;form.style.display="none";sessionPanel.style.display="block";showMessage("تم تسجيل الدخول بنجاح.","success")}else showMessage((result&&result.message)||"تعذر تسجيل الدخول.","error")})});
logoutButton.addEventListener("click",()=>{if(!sessionToken)return;logoutButton.disabled=true;postAction({action:"adminLogout",token:sessionToken},"adminLogoutResult",result=>{logoutButton.disabled=false;if(result&&result.success){sessionToken="";sessionPanel.style.display="none";form.style.display="block";showMessage("تم تسجيل الخروج وإلغاء الجلسة.","success");password.focus()}else showMessage((result&&result.message)||"تعذر تسجيل الخروج.","error")})});
})();
</script></body></html>
