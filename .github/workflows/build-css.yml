name: Build production Tailwind CSS

on:
  push:
    branches:
      - main
      - perf/static-tailwind-production
    paths:
      - "index.html"
      - "src/tailwind.css"
      - ".github/workflows/build-css.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-css:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Tailwind CSS v4 compiler
        run: npm install --no-save --no-package-lock @tailwindcss/cli@4.1.10 tailwindcss@4.1.10

      - name: Generate minified production stylesheet
        run: npx @tailwindcss/cli -i ./src/tailwind.css -o ./styles.css --minify

      - name: Commit generated stylesheet when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          if git diff --cached --quiet; then
            echo "Production CSS is already up to date."
            exit 0
          fi
          git commit -m "build: regenerate production Tailwind CSS"
          git push
