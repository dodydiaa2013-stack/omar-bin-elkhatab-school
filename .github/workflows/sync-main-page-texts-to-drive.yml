name: Sync approved repository page text to Google Drive

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "page-changes-production.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-main-page-text-to-drive
  cancel-in-progress: false

jobs:
  sync-main-to-drive:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact approved main commit and its parent history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install HTML parser
        run: npm install --no-save --no-package-lock jsdom@26

      - name: Determine changed source files
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            printf 'GITHUB_CHANGED_PATHS=__manual__\n' >> "$GITHUB_ENV"
          else
            if [ -z "${GITHUB_EVENT_BEFORE:-}" ] || [[ "$GITHUB_EVENT_BEFORE" =~ ^0+$ ]]; then
              CHANGED="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
            else
              CHANGED="$(git diff --name-only "$GITHUB_EVENT_BEFORE" "$GITHUB_SHA")"
            fi
            {
              echo 'GITHUB_CHANGED_PATHS<<__CHANGED_PATHS__'
              printf '%s\n' "$CHANGED"
              echo '__CHANGED_PATHS__'
            } >> "$GITHUB_ENV"
          fi

      - name: Validate source and synchronization client
        run: |
          set -euo pipefail
          node --check scripts/sync-main-page-texts-to-drive.mjs
          node scripts/test-page-text-integrity.mjs

      - name: Send signed main snapshot to Apps Script
        env:
          APPS_SCRIPT_SYNC_URL: ${{ secrets.APPS_SCRIPT_SYNC_URL }}
          APPS_SCRIPT_SYNC_HMAC_SECRET: ${{ secrets.APPS_SCRIPT_SYNC_HMAC_SECRET }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          GITHUB_COMMIT_TIMESTAMP="$(git show -s --format=%cI "$GITHUB_SHA")"
          export GITHUB_COMMIT_TIMESTAMP
          node scripts/sync-main-page-texts-to-drive.mjs
