name: Validate page text repair code

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  syntax-check:
    name: syntax-check-page-text-repair
    if: github.event.pull_request.head.ref == 'fix/strict-page-text-sync-2026-11-22'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check synchronization script syntax
        run: node --check scripts/sync-page-texts.mjs

      - name: Check Apps Script reference syntax
        run: |
          cp reference-only/Code-production-GitHub-only.gs /tmp/Code-production-GitHub-only.js
          node --check /tmp/Code-production-GitHub-only.js

      - name: Smoke-test text synchronization without changing repository files
        run: |
          set -euo pipefail
          npm install --no-save jsdom@26
          temp_dir="$(mktemp -d)"
          mkdir -p "$temp_dir/scripts"
          cp index.html page-changes-production.json "$temp_dir/"
          cp scripts/sync-page-texts.mjs "$temp_dir/scripts/"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$temp_dir/node_modules"
          (
            cd "$temp_dir"
            node scripts/sync-page-texts.mjs
            node <<'NODE'
            const fs = require('fs');
            const { JSDOM } = require('jsdom');
            const payload = JSON.parse(fs.readFileSync('page-changes-production.json', 'utf8'));
            const document = new JSDOM(fs.readFileSync('index.html', 'utf8')).window.document;
            const elements = Array.from(document.querySelectorAll('[data-page-edit-id]'));
            const byId = new Map();
            for (const element of elements) {
              const id = element.getAttribute('data-page-edit-id');
              if (!id || byId.has(id)) throw new Error('Empty or duplicate HTML edit ID.');
              byId.set(id, element.textContent);
            }
            if (byId.size !== payload.changes.length) {
              throw new Error('HTML/JSON ID counts differ after synchronization.');
            }
            for (const item of payload.changes) {
              if (!byId.has(item.id) || byId.get(item.id) !== item.text) {
                throw new Error('Synchronized text mismatch for ID: ' + item.id);
              }
            }
            console.log('Smoke test passed for ' + payload.changes.length + ' text entries.');
          NODE
          )
