name: Validate saved page text PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-page-text:
    name: validate-page-text
    if: github.event.pull_request.head.ref == 'automation/page-text-sync'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact pull request commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install HTML parser
        run: npm install --no-save jsdom@26

      - name: Validate changed files, IDs, and saved text values
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const { JSDOM } = require('jsdom');

          const expectedFiles = ['index.html', 'page-changes-production.json'];
          const changedFiles = execFileSync(
            'git',
            ['diff', '--name-only', `origin/${process.env.BASE_REF}...HEAD`],
            { encoding: 'utf8' }
          ).trim().split('\n').filter(Boolean).sort();

          if (JSON.stringify(changedFiles) !== JSON.stringify(expectedFiles.slice().sort())) {
            throw new Error(
              'Unexpected files in page-text PR: ' + JSON.stringify(changedFiles)
            );
          }

          const payload = JSON.parse(fs.readFileSync('page-changes-production.json', 'utf8'));
          if (!payload || payload.success !== true || !Array.isArray(payload.changes) ||
              payload.changes.length > 500) {
            throw new Error('Invalid page text payload.');
          }

          const jsonById = new Map();
          for (const item of payload.changes) {
            if (!item || typeof item.id !== 'string' || !item.id.trim() ||
                item.id.length > 200 || typeof item.text !== 'string' ||
                item.text.length > 10000 || jsonById.has(item.id)) {
              throw new Error('Invalid or duplicate page text item.');
            }
            jsonById.set(item.id, item.text);
          }

          const html = fs.readFileSync('index.html', 'utf8');
          const document = new JSDOM(html).window.document;
          const elements = Array.from(document.querySelectorAll('[data-page-edit-id]'));
          const htmlById = new Map();

          for (const element of elements) {
            const id = element.getAttribute('data-page-edit-id');
            if (!id || htmlById.has(id)) {
              throw new Error('Empty or duplicate HTML edit ID: ' + id);
            }
            htmlById.set(id, element.textContent);
          }

          if (htmlById.size !== jsonById.size) {
            throw new Error('HTML/JSON edit ID counts do not match.');
          }

          for (const [id, expectedText] of jsonById) {
            if (!htmlById.has(id)) {
              throw new Error('HTML is missing saved edit ID: ' + id);
            }
            if (htmlById.get(id) !== expectedText) {
              throw new Error('HTML text does not match saved JSON for ID: ' + id);
            }
          }

          for (const id of htmlById.keys()) {
            if (!jsonById.has(id)) {
              throw new Error('HTML contains an ID with no JSON record: ' + id);
            }
          }

          console.log(
            'Validated ' + jsonById.size +
            ' page text entries; HTML and JSON IDs and text values match.'
          );
          NODE
