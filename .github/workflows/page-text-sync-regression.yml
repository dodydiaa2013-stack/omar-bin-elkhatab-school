name: Production page-text sync regression tests

on:
  pull_request:
    paths:
      - "index.html"
      - "page-changes-production.json"
      - "scripts/sync-page-texts.mjs"
      - "scripts/sync-page-texts.test.mjs"
      - "scripts/verify-page-texts.mjs"
      - ".github/workflows/sync-page-texts.yml"
      - ".github/workflows/page-text-sync-regression.yml"
  push:
    branches:
      - "fix/production-page-text-sync-one-shot-2026-11-22"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the proposed fix
        uses: actions/checkout@v4
        with:
          ref: \${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fetch the latest production save from the dedicated input branch
        run: |
          set -euo pipefail
          git fetch origin automation/page-text-sync-input
          git show origin/automation/page-text-sync-input:page-changes-production.json > page-changes-production.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the HTML parser
        run: npm install --no-save --no-package-lock jsdom@26

      - name: Run isolated synchronization regression tests
        run: |
          node --check scripts/sync-page-texts.mjs
          node --check scripts/sync-page-texts.test.mjs
          node --test scripts/sync-page-texts.test.mjs

      - name: Run the real production payload through the proposed synchronizer
        run: |
          set -euo pipefail
          node scripts/sync-page-texts.mjs
          node scripts/verify-page-texts.mjs
          git diff --check
