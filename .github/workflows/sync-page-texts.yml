name: Prepare saved page text review pull request
# This workflow proposes saved page-text changes for human review only.
# It never merges or publishes.
on:
  repository_dispatch:
    types:
      - production-page-text-saved

  # Fallback in case the Apps Script dispatch cannot be delivered.
  schedule:
    - cron: "*/5 * * * *"

  push:
    branches:
      - "automation/page-text-sync-input"
    paths:
      - "page-changes-production.json"

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: page-text-sync-proposal
  cancel-in-progress: false

jobs:
  prepare-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the current production baseline
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preserve baseline and fetch the latest saved input
        run: |
          set -euo pipefail

          # Keep the JSON from main as the immutable comparison baseline.
          cp page-changes-production.json page-changes-production.baseline.json

          git fetch origin automation/page-text-sync-input
          git show origin/automation/page-text-sync-input:page-changes-production.json > page-changes-production.incoming.json

          node <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('page-changes-production.incoming.json', 'utf8'));
          if (!p || p.success !== true || !Array.isArray(p.changes) || p.changes.length > 500) {
            throw new Error('Invalid page text payload.');
          }
          const ids = new Set();
          for (const item of p.changes) {
            if (!item || typeof item.id !== 'string' || !item.id ||
                item.id.length > 200 || typeof item.text !== 'string' ||
                item.text.length > 10000 || ids.has(item.id)) {
              throw new Error('Invalid or duplicate page text item.');
            }
            ids.add(item.id);
          }
          NODE

          mv page-changes-production.incoming.json page-changes-production.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install HTML parser
        run: npm install --no-save --no-package-lock jsdom@26

      - name: Run page-text synchronization regression tests
        run: node --test scripts/sync-page-texts.test.mjs

      - name: Apply saved text changes with conflict protection
        run: |
          set -euo pipefail
          node scripts/sync-page-texts.mjs page-changes-production.baseline.json
          test -s index.html
          git diff --check

      - name: Create or update a draft review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --create automation/page-text-sync
          git add page-changes-production.json index.html

          if git diff --cached --quiet; then
            echo "No page text changes are needed."
            exit 0
          fi

          git commit -m "Prepare saved school page text review"
          git push --force origin HEAD:automation/page-text-sync

          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head automation/page-text-sync --base main --state open --json number --jq '.[0].number // empty')

          if [ -z "$pr_number" ]; then
            gh pr create --draft \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head automation/page-text-sync \
              --title "Review saved school page text update" \
              --body "## Saved page-text review

          - Generated from the dedicated page-text input branch.
          - Updates only page-changes-production.json and matching text in index.html.
          - Uses the current main JSON as a baseline to detect direct HTML edits and conflicts.
          - Requires exact ID equality across HTML, baseline JSON, and incoming JSON.
          - Never generates edit IDs automatically.
          - Runs regression tests for no-op, saved edits, mismatches, and duplicate IDs.
          - This pull request is intentionally draft.
          - No automatic merge, publication, or deployment is performed."
            pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head automation/page-text-sync --base main --state open --json number --jq '.[0].number')
          else
            is_draft=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
            if [ "$is_draft" != "true" ]; then
              pr_node_id=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json id --jq '.id')
              gh api graphql -f query='mutation($pullRequestId: ID!) { convertPullRequestToDraft(input: {pullRequestId: $pullRequestId}) { pullRequest { isDraft } } }' -F pullRequestId="$pr_node_id"
            fi
            gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" \
              --title "Review saved school page text update" \
              --body "## Saved page-text review

          - Generated from the dedicated page-text input branch.
          - Updates only page-changes-production.json and matching text in index.html.
          - Uses the current main JSON as a baseline to detect direct HTML edits and conflicts.
          - Requires exact ID equality across HTML, baseline JSON, and incoming JSON.
          - Never generates edit IDs automatically.
          - Runs regression tests for no-op, saved edits, mismatches, and duplicate IDs.
          - This pull request is intentionally draft.
          - No automatic merge, publication, or deployment is performed."
          fi

          echo "Draft review PR is ready for human inspection. No merge was attempted."
