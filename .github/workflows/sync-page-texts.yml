name: Prepare saved page text review pull request
# The workflow prepares a reviewable text-only change. It never merges or publishes.
on:
  # Apps Script dispatches this event only after GitHub save verification succeeds.
  repository_dispatch:
    types:
      - production-page-text-saved

  # Manual recovery path; no periodic polling or arbitrary branch-push trigger.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: page-text-sync-proposal
  cancel-in-progress: false

jobs:
  prepare-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main as the clean base
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preserve current production payload and fetch latest saved changes
        run: |
          set -euo pipefail
          git show HEAD:page-changes-production.json > /tmp/page-changes-main.json
          git fetch origin automation/page-text-sync-input
          git show origin/automation/page-text-sync-input:page-changes-production.json > page-changes-production.json
          node <<'NODE'
          const p = require('./page-changes-production.json');
          if (!p || p.success !== true || !Array.isArray(p.changes) || p.changes.length > 500) {
            throw new Error('Invalid page text payload.');
          }
          const ids = new Set();
          for (const item of p.changes) {
            if (!item || typeof item.id !== 'string' || !item.id.trim() ||
                item.id.length > 200 || typeof item.text !== 'string' ||
                item.text.length > 10000 || ids.has(item.id)) {
              throw new Error('Invalid or duplicate page text item.');
            }
            ids.add(item.id);
          }
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install HTML parser
        run: npm install --no-save jsdom@26

      - name: Apply text changes and enforce exact HTML/JSON parity
        run: |
          set -euo pipefail
          node scripts/sync-page-texts.mjs
          node <<'NODE'
          const fs = require('fs');
          const payload = require('./page-changes-production.json');
          const mainPayload = JSON.parse(fs.readFileSync('/tmp/page-changes-main.json', 'utf8'));
          const html = fs.readFileSync('index.html', 'utf8');
          const { JSDOM } = require('jsdom');
          const document = new JSDOM(html).window.document;
          const htmlIds = Array.from(document.querySelectorAll('[data-page-edit-id]'))
            .map(el => el.getAttribute('data-page-edit-id'));
          const jsonIds = payload.changes.map(item => item.id);
          const uniqueHtml = new Set(htmlIds);
          const uniqueJson = new Set(jsonIds);
          if (uniqueHtml.size !== htmlIds.length || uniqueJson.size !== jsonIds.length ||
              uniqueHtml.size !== uniqueJson.size ||
              Array.from(uniqueHtml).some(id => !uniqueJson.has(id)) ||
              Array.from(uniqueJson).some(id => !uniqueHtml.has(id))) {
            throw new Error('HTML/JSON edit ID parity check failed.');
          }
          const normalize = p => JSON.stringify((p.changes || [])
            .map(({id, text}) => ({id, text}))
            .sort((a, b) => a.id.localeCompare(b.id)));
          if (normalize(payload) === normalize(mainPayload)) {
            fs.copyFileSync('/tmp/page-changes-main.json', 'page-changes-production.json');
            console.log('No actual text-value changes; timestamp-only update discarded.');
          }
          NODE
          git diff --check

      - name: Create or update a draft review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --create automation/page-text-sync
          git add page-changes-production.json index.html

          if git diff --cached --quiet; then
            echo "No page text changes are needed."
            exit 0
          fi

          git commit -m "Prepare saved school page text review"
          git push --force origin HEAD:automation/page-text-sync

          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head automation/page-text-sync --base main --state open --json number --jq '.[0].number // empty')

          if [ -z "$pr_number" ]; then
            gh pr create --draft \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head automation/page-text-sync \
              --title "Review saved school page text update" \
              --body "## Saved page-text review

          - Generated from the dedicated page-text input branch.
          - Updates only page-changes-production.json and matching text in index.html.
          - Enforces exact HTML/JSON edit-ID parity; no IDs are invented during synchronization.
          - Timestamp-only updates are discarded.
          - This pull request is intentionally draft.
          - No automatic merge, publication, or deployment is performed."
            pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head automation/page-text-sync --base main --state open --json number --jq '.[0].number')
          else
            is_draft=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
            if [ "$is_draft" != "true" ]; then
              pr_node_id=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json id --jq '.id')
              gh api graphql -f query='mutation($pullRequestId: ID!) { convertPullRequestToDraft(input: {pullRequestId: $pullRequestId}) { pullRequest { isDraft } } }' -F pullRequestId="$pr_node_id"
            fi
            gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" \
              --title "Review saved school page text update" \
              --body "## Saved page-text review

          - Generated from the dedicated page-text input branch.
          - Updates only page-changes-production.json and matching text in index.html.
          - Enforces exact HTML/JSON edit-ID parity; no IDs are invented during synchronization.
          - Timestamp-only updates are discarded.
          - This pull request is intentionally draft.
          - No automatic merge, publication, or deployment is performed."
          fi

          echo "Draft review PR is ready for human inspection. No merge was attempted."
