name: Validate and auto-publish saved page text
# Only page text saved by the authenticated production admin flow is processed.
# A generated PR is merged only after the text payload and resulting HTML pass validation.
on:
  repository_dispatch:
    types:
      - production-page-text-saved
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - "automation/page-text-sync-input"
    paths:
      - "page-changes-production.json"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: page-text-sync-proposal
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch and strictly validate saved text payload
        run: |
          set -euo pipefail
          git fetch origin automation/page-text-sync-input
          git show origin/automation/page-text-sync-input:page-changes-production.json > page-changes-production.json
          node <<'NODE'
          const p = require('./page-changes-production.json');
          const allowed = new Set([
            "school-title", "school-administration", "home-title",
            "home-vision-text", "home-mission-text",
            "results-card-title", "results-card-description",
            "support-card-title", "support-card-description",
            "schedules-card-title", "schedules-card-description",
            "tablet-title", "tablet-description", "server-title",
            "tablet-support-title", "schedules-title",
            "schedules-description", "alerts-title", "alerts-description",
            "republic-header", "academic-year", "header-manager",
            "home-intro", "footer-leadership", "footer-school-name",
            "quick-links-title", "quick-results-link", "quick-tablet-link",
            "quick-schedules-link", "quick-gallery-link",
            "quick-student-queries-link", "quick-leaders-link",
            "support-section-title", "footer-manager",
            "support-responsibles-title", "support-diaa-name",
            "support-mona-name", "motto-tablet-title",
            "motto-tablet-description", "motto-dev-title",
            "motto-dev-description", "student-queries-title",
            "student-queries-description", "student-query-one-title",
            "student-query-two-title", "server-tip-1", "server-tip-2",
            "server-tip-3", "server-tip-4", "tablet-support-tip-1",
            "tablet-support-tip-2", "tablet-support-tip-3",
            "tablet-support-tip-4", "ticker-message-1",
            "ticker-message-2", "ticker-message-3", "ticker-message-4",
            "footer-copyright"
          ]);
          if (!p || p.success !== true || !Array.isArray(p.changes) ||
              p.changes.length < 1 || p.changes.length > 500) {
            throw new Error("Invalid page text payload.");
          }
          const ids = new Set();
          for (const item of p.changes) {
            if (!item || typeof item.id !== "string" ||
                typeof item.text !== "string" || !item.id ||
                item.id.length > 200 || item.text.length > 10000 ||
                ids.has(item.id) ||
                (!allowed.has(item.id) && !/^auto-[0-9a-f]{16}$/.test(item.id))) {
              throw new Error("Invalid, duplicate, or unauthorized page text item.");
            }
            ids.add(item.id);
          }
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install HTML parser
        run: npm install --no-save jsdom@26

      - name: Apply text changes and validate resulting page
        run: |
          set -euo pipefail
          node scripts/sync-page-texts.mjs
          test -s index.html
          git diff --check
          node <<'NODE'
          const fs = require('fs');
          const { JSDOM } = require('jsdom');
          const html = fs.readFileSync('index.html', 'utf8');
          const dom = new JSDOM(html);
          const d = dom.window.document;
          if (!d.doctype || !d.head || !d.body ||
              !d.head.querySelector('title') ||
              !d.head.querySelector('meta[charset]') ||
              !d.head.querySelector('link[rel="stylesheet"]') ||
              d.head.querySelectorAll('meta').length < 5 ||
              d.body.querySelectorAll('script').length < 1) {
            throw new Error('Production HTML structural validation failed.');
          }
          const ids = new Set();
          for (const el of d.querySelectorAll('[data-page-edit-id]')) {
            const id = el.getAttribute('data-page-edit-id');
            if (!id || ids.has(id)) throw new Error('Missing or duplicate HTML text edit ID.');
            ids.add(id);
          }
          NODE

      - name: Enforce text-only file scope
        run: |
          set -euo pipefail
          git add page-changes-production.json index.html
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\\n' index.html page-changes-production.json | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected changed-file scope:"
            printf '%s\\n' "$changed"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No page text changes are needed."
            exit 0
          fi

      - name: Create or update validated text-only pull request
        id: proposal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create automation/page-text-sync
          git commit -m "Publish validated production page text"
          git push --force origin HEAD:automation/page-text-sync

          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head automation/page-text-sync --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr_number" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main \
              --head automation/page-text-sync \
              --title "Publish validated school page text" \
              --body "## Automatic page-text publication

          This PR is generated only from the authenticated production admin save flow.
          Validation completed before this PR was created:
          - Strict payload structure, allowed IDs, duplicate-ID and length checks.
          - HTML structure and stable edit-ID checks.
          - Exact changed-file scope: index.html and page-changes-production.json only.
          - Whitespace/error check with git diff --check.

          The workflow merges this PR only after these validations pass. No scripts, styles, images, or unrelated files are included."
            pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head automation/page-text-sync --base main --state open --json number --jq '.[0].number')
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Merge the validated text-only change
        if: steps.proposal.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_number="${{ steps.proposal.outputs.number }}"
          gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --squash
          gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" \
            --json state,mergedAt,baseRefName \
            --jq 'if .state == "MERGED" and .mergedAt != null and .baseRefName == "main" then "Validated page-text PR merged into main." else error("Page-text PR was not merged into main.") end'
