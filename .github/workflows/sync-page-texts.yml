name: Validate and auto-publish saved page text
# Only page text saved by the authenticated production admin flow is processed.
# A generated PR is merged only after the text payload and resulting HTML pass validation.
on:
  repository_dispatch:
    types:
      - production-page-text-saved
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - "automation/page-text-sync-input"
    paths:
      - "page-changes-production.json"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: page-text-sync-proposal
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch and strictly validate saved text payload
        run: |
          set -euo pipefail
          git fetch origin automation/page-text-sync-input
          git show origin/automation/page-text-sync-input:page-changes-production.json > page-changes-production.json
          node <<'NODE'
          const p = require('./page-changes-production.json');
          const allowed = new Set([
            "school-title", "school-administration", "home-title",
            "home-vision-text", "home-mission-text",
            "results-card-title", "results-card-description",
            "support-card-title", "support-card-description",
            "schedules-card-title", "schedules-card-description",
            "tablet-title", "tablet-description", "server-title",
            "tablet-support-title", "schedules-title",
            "schedules-description", "alerts-title", "alerts-description",
            "republic-header", "academic-year", "header-manager",
            "home-intro", "footer-leadership", "footer-school-name",
            "quick-links-title", "quick-results-link", "quick-tablet-link",
            "quick-schedules-link", "quick-gallery-link",
            "quick-student-queries-link", "quick-leaders-link",
            "support-section-title", "footer-manager",
            "support-responsibles-title", "support-diaa-name",
            "support-mona-name", "motto-tablet-title",
            "motto-tablet-description", "motto-dev-title",
            "motto-dev-description", "student-queries-title",
            "student-queries-description", "student-query-one-title",
            "student-query-two-title", "server-tip-1", "server-tip-2",
            "server-tip-3", "server-tip-4", "tablet-support-tip-1",
            "tablet-support-tip-2", "tablet-support-tip-3",
            "tablet-support-tip-4", "ticker-message-1",
            "ticker-message-2", "ticker-message-3", "ticker-message-4",
            "footer-copyright"
          ]);
          if (!p || p.success !== true || !Array.isArray(p.changes) ||
              p.changes.length < 1 || p.changes.length > 500) {
            throw new Error("Invalid page text payload.");
          }
          const ids = new Set();
          for (const item of p.changes) {
            if (!item || typeof item.id !== "string" ||
                typeof item.text !== "string" || !item.id ||
                item.id.length > 200 || item.text.length > 10000 ||
                ids.has(item.id) ||
                (!allowed.has(item.id) && !/^auto-[0-9a-f]{16}$/.test(item.id))) {
              throw new Error("Invalid, duplicate, or unauthorized page text item.");
            }
            ids.add(item.id);
          }
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install HTML parser
        run: npm install --no-save jsdom@26

      - name: Apply text changes and validate resulting page
        run: |
          set -euo pipefail
          node scripts/sync-page-texts.mjs
          test -s index.html
          git diff --check
          node <<'NODE'
          const fs = require('fs');
          const { JSDOM } = require('jsdom');
          const rawHtml = fs.readFileSync('index.html', 'utf8');
          // Strip a leading UTF-8 BOM for DOM parsing only; keep the source file unchanged.
          const html = rawHtml.charCodeAt(0) === 0xFEFF ? rawHtml.slice(1) : rawHtml;
          const dom = new JSDOM(html);
          const d = dom.window.document;
          if (!d.doctype || !d.head || !d.body ||
              !d.head.querySelector('title') ||
              !d.head.querySelector('meta[charset]') ||
              !d.head.querySelector('link[rel="stylesheet"]') ||
              d.head.querySelectorAll('meta').length < 5 ||
              d.body.querySelectorAll('script').length < 1) {
            throw new Error('Production HTML structural validation failed.');
          }
          const ids = new Set();
          for (const el of d.querySelectorAll('[data-page-edit-id]')) {
            const id = el.getAttribute('data-page-edit-id');
            if (!id || ids.has(id)) throw new Error('Missing or duplicate HTML text edit ID.');
            ids.add(id);
          }
          NODE

      - name: Enforce text-only file scope
        run: |
          set -euo pipefail
          git add page-changes-production.json index.html

          # A no-op is valid: stop before requiring the payload file in the staged diff.
          if git diff --cached --quiet; then
            echo "No page text changes are needed."
            exit 0
          fi

          changed="$(git diff --cached --name-only)"
          if ! printf '%s\n' "$changed" | grep -qx 'page-changes-production.json'; then
            echo "The saved page-text payload must be part of the change."
            exit 1
          fi
          while IFS= read -r file; do
            case "$file" in
              index.html|page-changes-production.json) ;;
              *) echo "Unexpected changed file: $file"; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Create or update validated text-only pull request
        id: proposal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create automation/page-text-sync
          git commit -m "Publish validated production page text"
          git push --force origin HEAD:automation/page-text-sync

          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head automation/page-text-sync --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr_number" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main \
              --head automation/page-text-sync \
              --title "Publish validated school page text" \
              --body "## Automatic page-text publication

          This PR is generated only from the authenticated production admin save flow.
          Validation completed before this PR was created:
          - Strict payload structure, allowed IDs, duplicate-ID and length checks.
          - HTML structure and stable edit-ID checks.
          - Exact changed-file scope: index.html and page-changes-production.json only.
          - Whitespace/error check with git diff --check.
          - Successful GitHub Actions validation checks on the exact PR head SHA.

          Netlify deploy previews are optional and are not a publication requirement. The workflow refuses to merge if any non-Netlify validation check fails or remains pending. No scripts, styles, images, or unrelated files are included."
            pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head automation/page-text-sync --base main --state open --json number --jq '.[0].number')
          fi

          # Existing page-text PRs may have been created as drafts by the
          # earlier review-only workflow. This publisher owns this exact
          # generated head/base pair, so make that PR ready before checking it.
          pr_json="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json state,baseRefName,headRefName,isDraft)"
          test "$(printf '%s' "$pr_json" | jq -r '.state')" = "OPEN"
          test "$(printf '%s' "$pr_json" | jq -r '.baseRefName')" = "main"
          test "$(printf '%s' "$pr_json" | jq -r '.headRefName')" = "automation/page-text-sync"
          if [ "$(printf '%s' "$pr_json" | jq -r '.isDraft')" = "true" ]; then
            gh pr ready "$pr_number" --repo "$GITHUB_REPOSITORY"
          fi
          pr_is_draft="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          if [ "$pr_is_draft" != "false" ]; then
            echo "The page-text PR could not be marked ready for review."
            exit 1
          fi

          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Wait for successful GitHub Actions pull-request checks
        if: steps.proposal.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_number="${{ steps.proposal.outputs.number }}"
          expected_sha="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          if [ -z "$expected_sha" ]; then
            echo "Could not determine the exact pull-request head SHA."
            exit 1
          fi

          echo "Waiting for non-Netlify validation checks on exact PR head: $expected_sha"
          checks_ready=false
          for attempt in $(seq 1 40); do
            pr_json="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json state,baseRefName,headRefOid)"
            pr_state="$(printf '%s' "$pr_json" | jq -r '.state')"
            pr_base="$(printf '%s' "$pr_json" | jq -r '.baseRefName')"
            current_sha="$(printf '%s' "$pr_json" | jq -r '.headRefOid')"

            if [ "$pr_state" != "OPEN" ] || [ "$pr_base" != "main" ] || [ "$current_sha" != "$expected_sha" ]; then
              echo "PR state, base branch, or head SHA changed while waiting. Refusing to merge."
              exit 1
            fi

            status_json="$(gh api "repos/$GITHUB_REPOSITORY/commits/$expected_sha/status")"
            checks_json="$(gh api "repos/$GITHUB_REPOSITORY/commits/$expected_sha/check-runs")"

            # Netlify is optional. Ignore its contexts in every state, but enforce all other checks.
            bad_statuses="$(printf '%s' "$status_json" | jq -r '[.statuses[]? | select((.context | test("netlify|deploy-preview"; "i") | not) and (.state == "failure" or .state == "error"))] | length')"
            if [ "$bad_statuses" != "0" ]; then
              echo "A non-Netlify commit status reported failure."
              printf '%s' "$status_json" | jq -r '.statuses[]? | select((.context | test("netlify|deploy-preview"; "i") | not) and (.state == "failure" or .state == "error")) | [.context, .state, (.description // "")] | @tsv'
              exit 1
            fi

            bad_checks="$(printf '%s' "$checks_json" | jq -r '[.check_runs[]? | select(((.app.slug // "") != "netlify" and (.name | test("netlify|deploy-preview"; "i") | not)) and .status == "completed" and (.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "action_required" or .conclusion == "startup_failure"))] | length')"
            if [ "$bad_checks" != "0" ]; then
              echo "A non-Netlify GitHub Actions check failed."
              printf '%s' "$checks_json" | jq -r '.check_runs[]? | select(((.app.slug // "") != "netlify" and (.name | test("netlify|deploy-preview"; "i") | not)) and .status == "completed" and (.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "action_required" or .conclusion == "startup_failure")) | [.name, .conclusion] | @tsv'
              exit 1
            fi

            pending_statuses="$(printf '%s' "$status_json" | jq -r '[.statuses[]? | select((.context | test("netlify|deploy-preview"; "i") | not) and .state != "success")] | length')"
            pending_checks="$(printf '%s' "$checks_json" | jq -r '[.check_runs[]? | select(((.app.slug // "") != "netlify" and (.name | test("netlify|deploy-preview"; "i") | not)) and (.status != "completed" or (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped")))] | length')"

            # The workflow already ran strict payload/HTML/scope validation before opening this PR.
            # A PR created with GITHUB_TOKEN may not trigger other GitHub Actions workflows,
            # so an empty non-Netlify check list is valid; any check that does exist must finish cleanly.
            if [ "$pending_statuses" = "0" ] &&
               [ "$pending_checks" = "0" ]; then
              checks_ready=true
              break
            fi

            echo "Non-Netlify validation checks are not all complete yet (attempt $attempt/40); waiting 15 seconds."
            sleep 15
          done

          if [ "$checks_ready" != "true" ]; then
            echo "Non-Netlify GitHub validation checks were not all confirmed successful within 10 minutes. Refusing to merge."
            exit 1
          fi

      - name: Merge only after all non-Netlify checks succeed
        if: steps.proposal.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_number="${{ steps.proposal.outputs.number }}"
          expected_sha="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"

          # Re-read PR identity and checks immediately before merge.
          pr_json="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json state,baseRefName,headRefOid)"
          test "$(printf '%s' "$pr_json" | jq -r '.state')" = "OPEN"
          test "$(printf '%s' "$pr_json" | jq -r '.baseRefName')" = "main"
          test "$(printf '%s' "$pr_json" | jq -r '.headRefOid')" = "$expected_sha"

          status_json="$(gh api "repos/$GITHUB_REPOSITORY/commits/$expected_sha/status")"
          checks_json="$(gh api "repos/$GITHUB_REPOSITORY/commits/$expected_sha/check-runs")"
          pending_statuses="$(printf '%s' "$status_json" | jq -r '[.statuses[]? | select((.context | test("netlify|deploy-preview"; "i") | not) and .state != "success")] | length')"
          pending_checks="$(printf '%s' "$checks_json" | jq -r '[.check_runs[]? | select(((.app.slug // "") != "netlify" and (.name | test("netlify|deploy-preview"; "i") | not)) and (.status != "completed" or (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped")))] | length')"

          # No non-Netlify checks may be pending or failing. An empty list is valid
          # because strict payload/HTML/scope validation ran before this PR was opened.
          test "$pending_statuses" = "0"
          test "$pending_checks" = "0"

          # GitHub itself still enforces any configured branch-protection requirements.
          gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --squash
          gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" \
            --json state,mergedAt,baseRefName \
            --jq 'if .state == "MERGED" and .mergedAt != null and .baseRefName == "main" then "All non-Netlify validation checks succeeded; page-text PR merged into main." else error("Page-text PR was not merged into main.") end'
