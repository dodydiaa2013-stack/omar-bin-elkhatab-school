name: Validate saved page text and open review PR
# Apps Script writes only to the dedicated input branch.
# This workflow builds from main, validates the result, then proposes
# the text-only update. Repository branch protection remains in force.
on:
  push:
    branches:
      - "automation/page-text-sync-input"
    paths:
      - "page-changes-production.json"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: page-text-sync-proposal
  cancel-in-progress: false

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main as the clean base
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preserve main text baseline
        run: git show main:page-changes-production.json > /tmp/main-page-changes-production.json

      - name: Fetch and validate latest saved changes
        run: |
          set -euo pipefail
          git fetch origin automation/page-text-sync-input
          git show origin/automation/page-text-sync-input:page-changes-production.json > page-changes-production.json
          node -e "const p=require('./page-changes-production.json'); if(!p || p.success!==true || !Array.isArray(p.changes) || p.changes.some(x=>!x || typeof x.id!=='string' || typeof x.text!=='string')) process.exit(1);"

      - name: Compare actual IDs and text, ignoring timestamp-only changes
        id: semantic
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const base = JSON.parse(fs.readFileSync("/tmp/main-page-changes-production.json", "utf8"));
          const latest = JSON.parse(fs.readFileSync("page-changes-production.json", "utf8"));
          const normalize = payload => {
            if (!payload || payload.success !== true || !Array.isArray(payload.changes)) {
              throw new Error("Invalid page text payload.");
            }
            const map = new Map();
            for (const item of payload.changes) {
              if (!item || typeof item.id !== "string" || typeof item.text !== "string" ||
                  !item.id.trim() || map.has(item.id)) {
                throw new Error("Invalid or duplicate page text ID.");
              }
              map.set(item.id, item.text);
            }
            return [...map.entries()].sort(([a], [b]) => a.localeCompare(b));
          };
          const changed = JSON.stringify(normalize(base)) !== JSON.stringify(normalize(latest));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "changed=" + String(changed) + "\\n");
          console.log(changed
            ? "Page text or ID set changed; continue to build the review proposal."
            : "Page text and ID set are unchanged; timestamp-only changes will not create a stale PR.");
          NODE

      - name: Close stale publication PR when text is unchanged
        if: steps.semantic.outputs.changed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head automation/page-text-sync --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr_number" ]; then
            gh pr close "$pr_number" --repo "$GITHUB_REPOSITORY" \\
              --comment "Closed automatically: the latest verified Drive snapshot has the same page text and IDs as main. Timestamp-only changes are ignored."
          fi
          echo "No semantic page text changes; no publication PR is needed."

      - name: Set up Node.js
        if: steps.semantic.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install HTML parser
        if: steps.semantic.outputs.changed == 'true'
        run: npm install --no-save jsdom@26

      - name: Apply and validate saved text changes
        if: steps.semantic.outputs.changed == 'true'
        run: |
          set -euo pipefail
          node scripts/sync-page-texts.mjs
          test -s index.html
          node -e "const fs=require('fs'); const h=fs.readFileSync('index.html','utf8'); if(!h.includes('data-page-edit-id=')) process.exit(1);"

      - name: Create or update the publication pull request
        if: steps.semantic.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --create automation/page-text-sync
          git add page-changes-production.json index.html

          # Locate an existing proposal before the no-diff branch so an old
          # draft PR cannot remain open after its changes are no longer needed.
          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head automation/page-text-sync --base main --state open --json number --jq '.[0].number // empty')

          if git diff --cached --quiet; then
            if [ -n "$pr_number" ]; then
              gh pr close "$pr_number" --repo "$GITHUB_REPOSITORY" \
                --comment "Closed automatically: the latest verified Drive snapshot produces no changes against main."
            fi
            echo "No page text changes are needed; stale open proposal closed if present."
            exit 0
          fi

          git commit -m "Prepare saved school page text update"
          git push --force origin HEAD:automation/page-text-sync

          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head automation/page-text-sync --base main --state open --json number --jq '.[0].number // empty')

          if [ -z "$pr_number" ]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head automation/page-text-sync \
              --draft \
              --title "Publish saved school page text" \
              --body "## Automatic page-text publication

          - Generated from the latest Google Drive-saved page text payload.
          - Updates only page-changes-production.json and matching text in index.html.
          - The workflow validates the generated update before proposing it.
          - GitHub branch protection is not bypassed; if a required approval or check blocks merging, the PR remains open and the workflow reports the failure."
            pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head automation/page-text-sync --base main --state open --json number --jq '.[0].number')
          fi

          # Keep publication pending for a human review; never auto-merge
          # or publish page text from this synchronization workflow.
          echo "Validated page-text update is awaiting manual review: PR #$pr_number"
