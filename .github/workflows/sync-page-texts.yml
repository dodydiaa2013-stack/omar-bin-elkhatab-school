name: Prepare saved page text review pull request
# The workflow prepares a reviewable text-only change. It never merges or publishes.
on:
  # Apps Script dispatches this event only after GitHub save verification succeeds.
  repository_dispatch:
    types:
      - production-page-text-saved

  # Fallback in case the dispatch request cannot be delivered.
  schedule:
    - cron: "*/5 * * * *"

  push:
    branches:
      - "automation/page-text-sync-input"
    paths:
      - "page-changes-production.json"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: page-text-sync-proposal
  cancel-in-progress: false

jobs:
  prepare-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main as the clean base
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch and validate latest saved changes
        id: fetch_saved
        run: |
          set -euo pipefail
          git fetch origin automation/page-text-sync-input
          git show origin/automation/page-text-sync-input:page-changes-production.json > page-changes-production.incoming.json
          node <<'NODE'
          const fs = require('node:fs');
          const incomingPath = 'page-changes-production.incoming.json';
          const incoming = JSON.parse(fs.readFileSync(incomingPath, 'utf8'));
          if (!incoming || incoming.success !== true ||
              !Array.isArray(incoming.changes) || incoming.changes.length > 500) {
            throw new Error('Invalid page text payload.');
          }

          const ids = new Set();
          for (const item of incoming.changes) {
            if (!item || typeof item.id !== 'string' || !item.id.trim() ||
                item.id.length > 200 || typeof item.text !== 'string' ||
                item.text.length > 10000 || ids.has(item.id)) {
              throw new Error('Invalid or duplicate page text item.');
            }
            ids.add(item.id);
          }

          let hasChanges = true;
          try {
            const current = JSON.parse(fs.readFileSync('page-changes-production.json', 'utf8'));
            if (current && Array.isArray(current.changes)) {
              const canonical = changes => changes
                .map(item => ({ id: item.id, text: item.text }))
                .sort((a, b) => a.id.localeCompare(b.id));
              hasChanges = JSON.stringify(canonical(current.changes)) !==
                JSON.stringify(canonical(incoming.changes));
            }
          } catch (_) {
            hasChanges = true;
          }

          if (hasChanges) {
            fs.copyFileSync(incomingPath, 'page-changes-production.json');
            console.log('New saved text content detected.');
          } else {
            console.log('No text content changes; timestamp-only updates will not create a PR.');
          }

          fs.unlinkSync(incomingPath);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'has_changes=' + hasChanges + '\n');
          NODE

      - name: Set up Node.js
        if: steps.fetch_saved.outputs.has_changes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install HTML parser
        if: steps.fetch_saved.outputs.has_changes == 'true'
        run: npm install --no-save jsdom@26

      - name: Run page-text synchronization regression tests
        if: steps.fetch_saved.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          node --check scripts/sync-page-texts.mjs
          node --check scripts/sync-page-texts.test.mjs
          node --test scripts/sync-page-texts.test.mjs

      - name: Apply and validate saved text changes
        if: steps.fetch_saved.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          node scripts/sync-page-texts.mjs
          node scripts/verify-page-texts.mjs
          test -s index.html
          git diff --check

      - name: Create or update a draft review pull request
        if: steps.fetch_saved.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --create automation/page-text-sync
          git add page-changes-production.json index.html

          if git diff --cached --quiet; then
            echo "No page text changes are needed."
            exit 0
          fi

          git commit -m "Prepare saved school page text review"
          git push --force origin HEAD:automation/page-text-sync

          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head automation/page-text-sync --base main --state open --json number --jq '.[0].number // empty')

          if [ -z "$pr_number" ]; then
            gh pr create --draft \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head automation/page-text-sync \
              --title "Review saved school page text update" \
              --body "## Saved page-text review

          - Generated from the dedicated page-text input branch.
          - Updates only page-changes-production.json and matching text in index.html.
          - The synchronization script validates the HTML structure, saved IDs, and duplicate IDs before proposing changes.
          - This pull request is intentionally draft.
          - No automatic merge, publication, or deployment is performed.
          - Review the diff and preview manually before approving."
            pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head automation/page-text-sync --base main --state open --json number --jq '.[0].number')
          else
            is_draft=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
            if [ "$is_draft" != "true" ]; then
              pr_node_id=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json id --jq '.id')
              gh api graphql -f query='mutation($pullRequestId: ID!) { convertPullRequestToDraft(input: {pullRequestId: $pullRequestId}) { pullRequest { isDraft } } }' -F pullRequestId="$pr_node_id"
            fi
            gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" \
              --title "Review saved school page text update" \
              --body "## Saved page-text review

          - Generated from the dedicated page-text input branch.
          - Updates only page-changes-production.json and matching text in index.html.
          - The synchronization script validates the HTML structure, saved IDs, and duplicate IDs before proposing changes.
          - This pull request is intentionally draft.
          - No automatic merge, publication, or deployment is performed.
          - Review the diff and preview manually before approving."
          fi

          echo "Draft review PR is ready for human inspection. No merge was attempted."
