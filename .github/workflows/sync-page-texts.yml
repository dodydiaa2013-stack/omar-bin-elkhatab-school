name: Validate saved page text and open review PR
# Apps Script writes only to the dedicated input branch.
# This workflow builds from main, validates the result, then proposes
# the text-only update. Repository branch protection remains in force.
on:
  push:
    branches:
      - "automation/page-text-sync-input"
    paths:
      - "page-changes-production.json"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: page-text-sync-proposal
  cancel-in-progress: false

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main as the clean base
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch and validate latest saved changes
        run: |
          set -euo pipefail
          git fetch origin automation/page-text-sync-input
          git show origin/automation/page-text-sync-input:page-changes-production.json > page-changes-production.json
          node -e "const p=require('./page-changes-production.json'); if(!p || p.success!==true || !Array.isArray(p.changes) || p.changes.some(x=>!x || typeof x.id!=='string' || typeof x.text!=='string')) process.exit(1);"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install HTML parser
        run: npm install --no-save jsdom@26

      - name: Apply and validate saved text changes
        run: |
          set -euo pipefail
          node scripts/sync-page-texts.mjs
          test -s index.html
          node -e "const fs=require('fs'); const h=fs.readFileSync('index.html','utf8'); if(!h.includes('data-page-edit-id=')) process.exit(1);"

      - name: Create or update the publication pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --create automation/page-text-sync
          git add page-changes-production.json index.html

          if git diff --cached --quiet; then
            echo "No page text changes are needed."
            exit 0
          fi

          git commit -m "Prepare saved school page text update"
          git push --force origin HEAD:automation/page-text-sync

          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head automation/page-text-sync --base main --state open --json number --jq '.[0].number // empty')

          if [ -z "$pr_number" ]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head automation/page-text-sync \
              --draft \
              --title "Publish saved school page text" \
              --body "## Automatic page-text publication

          - Generated from the latest Google Drive-saved page text payload.
          - Updates only page-changes-production.json and matching text in index.html.
          - The workflow validates the generated update before proposing it.
          - GitHub branch protection is not bypassed; if a required approval or check blocks merging, the PR remains open and the workflow reports the failure."
            pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head automation/page-text-sync --base main --state open --json number --jq '.[0].number')
          fi

          # Keep publication pending for a human review; never auto-merge
          # or publish page text from this synchronization workflow.
          echo "Validated page-text update is awaiting manual review: PR #$pr_number"
