name: Build preview Tailwind CSS

on:
  push:
    branches:
      - perf/tailwind-production-preview-2026-11-08
    paths:
      - "index.html"
      - "src/tailwind.css"
      - ".github/workflows/build-tailwind-preview.yml"

permissions:
  contents: write

concurrency:
  group: tailwind-preview-build
  cancel-in-progress: true

jobs:
  build-css:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the preview branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Tailwind CSS v4 compiler
        run: npm install --no-save --no-package-lock @tailwindcss/cli@4.1.10 tailwindcss@4.1.10

      - name: Generate minified production stylesheet
        run: npx @tailwindcss/cli -i ./src/tailwind.css -o ./styles.css --minify

      - name: Commit generated CSS to this preview branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          if git diff --cached --quiet; then
            echo "Preview CSS is already up to date."
            exit 0
          fi
          git commit -m "build: generate preview Tailwind CSS"
          git push origin "HEAD:${GITHUB_REF_NAME}"
