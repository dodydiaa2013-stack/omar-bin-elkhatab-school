name: Page text integrity checks

on:
  push:
    branches:
      - fix/page-text-sync-integrity-bidirectional
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-page-text-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install HTML parser
        run: npm install --no-save jsdom@26

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --check scripts/sync-page-texts.mjs
          node --check scripts/sync-main-page-texts-to-drive.mjs
          node --check scripts/test-page-text-integrity.mjs

      - name: Verify page text IDs, ticker messages, and refresh guard
        run: node scripts/test-page-text-integrity.mjs
