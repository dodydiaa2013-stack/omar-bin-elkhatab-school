name: Page text synchronization regression tests

on:
  push:
    branches:
      - "fix/page-text-sync-bidirectional-validation"
    paths:
      - "scripts/sync-page-texts.mjs"
      - "scripts/sync-page-texts.test.mjs"
      - ".github/workflows/page-text-sync-tests.yml"
  pull_request:
    paths:
      - "scripts/sync-page-texts.mjs"
      - "scripts/sync-page-texts.test.mjs"
      - ".github/workflows/page-text-sync-tests.yml"

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install HTML parser
        run: npm install --no-save --no-package-lock jsdom@26

      - name: Check JavaScript syntax
        run: |
          node --check scripts/sync-page-texts.mjs
          node --check scripts/sync-page-texts.test.mjs

      - name: Run regression tests
        run: node --test scripts/sync-page-texts.test.mjs
