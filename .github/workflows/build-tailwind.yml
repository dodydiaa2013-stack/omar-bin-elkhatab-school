name: Build static Tailwind CSS

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]
    paths:
      - "index.html"
      - "assets/tailwind.input.css"
      - ".github/workflows/build-tailwind.yml"

permissions:
  contents: read

concurrency:
  group: tailwind-build-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    # Only update branches in this repository; never write to a fork.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'automation/page-text-sync'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Tailwind CSS
        run: |
          npm install --no-save --no-package-lock tailwindcss@4.3.5 @tailwindcss/cli@4.3.5
          mkdir -p assets
          npx @tailwindcss/cli -i ./assets/tailwind.input.css -o ./assets/tailwind.css --minify

      - name: Commit generated CSS to pull request branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/tailwind.css
          if git diff --cached --quiet; then
            echo "Compiled CSS is already up to date."
            exit 0
          fi
          git commit -m "Build compiled Tailwind CSS"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
