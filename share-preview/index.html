<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>معاينة بطاقة مشاركة موقع مدرسة عمر بن الخطاب ث بنين</title>
<style>
*{box-sizing:border-box}
html{background:#071a35}
body{margin:0;min-height:100vh;padding:28px 18px 36px;background:linear-gradient(145deg,#06152d,#0b2c55 58%,#07172e);font-family:Tahoma,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff}
.note{max-width:980px;text-align:center;color:#dce8f7;font-size:14px;line-height:1.8}
.preview{width:min(100%,1000px);line-height:0;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 24px 65px #0008;border:1px solid #d9b66d}
.preview img{display:block;width:100%;height:auto;object-fit:contain}
@media(max-width:600px){body{padding:16px 10px 24px;gap:12px}.preview{border-radius:12px}.note{font-size:12px}}
</style>
</head>
<body>
<p class="note">معاينة بطاقة مشاركة الموقع — التصميم مطابق للصورة المرجعية، مع الحفاظ على الشعار الدائري وغصني السنابل الذهبيين وصورة المدرسة والنصوص كما هي، دون قص أو إعادة رسم.</p>
<main class="preview">
<img src="https://drive.google.com/uc?export=view&id=15J2H3SW4_MIyk8S2ma1hFRn6hctvlT3A" alt="بطاقة معاينة مدرسة عمر بن الخطاب ث بنين، بإطار دائري ذهبي وغصني سنابل وصورة المدرسة">
</main>
<p class="note">صفحة معاينة مستقلة فقط؛ لم يتم تعديل الصفحة الرئيسية أو بيانات المشاركة أو إعدادات الإنتاج.</p>
</body>
</html>
